function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('cartridge',2);r.onupgradeneeded=()=>{const d=r.result;['games','roms','states'].forEach(n=>{if(!d.objectStoreNames.contains(n))n==='games'?d.createObjectStore(n,{keyPath:'id'}):d.createObjectStore(n)})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

async function lrCover(g){const ext=(g.file.split('.').pop()||'').toLowerCase(),sys=LRX[ext]||LR[g.con];if(!sys)return null;

for(const base of [norm(g.file),clean(g.file)]){const m=base.match(/^[^(]*\([^)]*\)/);names.push(base);if(m&&m[0]!==base)names.push(m[0].trim());if(!base.includes('('))RG.forEach(r=>names.push(base+' '+r))}

for(const dir of ['Named_Boxarts','Named_Titles']){const urls=uniq.map(n=>'https://thumbnails.libretro.com/'+enc(sys)+'/'+dir+'/'+enc(n.replace(/[&*\/:`<>?\\|]/g,'_'))+'.png'),ok=await Promise.all(urls.map(imgOk)),i=ok.indexOf(true);

async function sgCover(g){if(!SG().key)throw new Error('No match in the free libretro library, and no SteamGridDB key is set in Settings. Rename the file to its standard No-Intro name, or add a key.');

let l=await sgFetch('/grids/game/'+r[0].id+'?dimensions=600x900&types=static');if(!l||!l.length)l=await sgFetch('/grids/game/'+r[0].id+'?types=static');

const url=l[0].url;try{const b=await (await fetch(url)).blob();if(b.size<3e6)return await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(b)})}catch{}return url}

function filtered(){let l=games.slice();const q=$('#q').value.trim().toLowerCase();
if(view==='fav')l=l.filter(g=>g.fav);if(view==='played')l=l.filter(g=>g.played);if(view.startsWith('c:'))l=l.filter(g=>g.con===view.slice(2));

const s={title:(a,b)=>a.title.localeCompare(b.title),console:(a,b)=>con(a.con).name.localeCompare(con(b.con).name)||a.title.localeCompare(b.title),added:(a,b)=>b.added-a.added,size:(a,b)=>b.size-a.size}[pref.sort];l.sort(s);if(view==='played')l.sort((a,b)=>b.played-a.played);return l}
function empty(msg){return `<div class="empty">${PAD}<h2 style="margin-top:0">${msg||'Your library is empty'}</h2><p>Drop ROM files here, or import them yourself. Nothing is uploaded anywhere.</p><button class="btn pri" onclick="$('#fi').click()">Import games</button></div>`}

function confirmD(msg,fn){const d=$('#dlg');d.innerHTML=`<h2 style="margin-top:0">Are you sure?</h2><p>${esc(msg)}</p><div class="acts"><button class="btn" value="x">Cancel</button><button class="btn dng" id="yes">Confirm</button></div>`;d.querySelector('.btn').onclick=()=>d.close();$('#yes').onclick=async()=>{d.close();await fn()};d.showModal()}
function conOpts(sel){return cons().map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}

async function addFiles(files){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
files=await bundleCues([...files]);if(!files.length)return;
const res=[],added=[];let ok=0;
for(const f of files){const e=(f.name.split('.').pop()||'').toLowerCase();let id=f._con||detect(f.name),st='Imported';
if(f.size===0){res.push([f.name,0,'—','Skipped: file is empty']);continue}
if(f.name.startsWith('.')||/^(txt|nfo|jpg|png|md|db|ini|exe|dll)$/.test(e)){res.push([f.name,f.size,'—','Skipped: not a game file']);continue}
const ex=games.find(g=>g.file===f.name&&g.size===f.size);if(ex){if(await getRom(ex.id)){res.push([f.name,f.size,'—','Skipped: already in library']);continue}await tx('roms','readwrite',t=>t.objectStore('roms').put(f,ex.id));res.push([f.name,f.size,con(ex.con).s,'Reattached to the existing entry']);ok++;continue}
if(!id){id='other';st=AMBIG[e]?'Imported — choose console ('+AMBIG[e]+')':'Imported — unknown type, choose console'}
if(f._con)st='Imported — .cue and .bin packed into one file (assumed PlayStation)';
const g={id:crypto.randomUUID(),title:clean(f.name),file:f.name,size:f.size,con:id,added:Date.now(),fav:false,desc:'',cover:'',played:0};
try{await tx(['games','roms'],'readwrite',t=>{t.objectStore('games').put(g);t.objectStore('roms').put(f,g.id)});games.push(g);added.push(g);ok++;res.push([f.name,f.size,con(id).s,st])}
catch(err){res.push([f.name,f.size,'—','Failed: browser storage is full or blocked'])}}
render();const d=$('#dlg');
d.innerHTML=`<h2 style="margin-top:0">Import complete: ${ok} of ${files.length} added</h2><div style="max-height:50vh;overflow:auto"><table><tr><th>File</th><th>Size</th><th>Console</th><th>Status</th></tr>${res.map(r=>`<tr><td>${esc(r[0])}</td><td>${fmt(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</table></div><div class="acts"><button class="btn pri" id="ok">Done</button></div>`;
$('#ok').onclick=()=>d.close();d.showModal();if(pref.ap!==false&&added.length)autoCovers(added)}

function details(id){const g=games.find(x=>x.id===id);if(!g)return;const c=con(g.con),d=$('#dlg');
d.innerHTML=`<button class="x" id="cx" aria-label="Close">✕</button><div class="dh"><div class="dc">${cover(g)}</div><div class="di"><h2>${esc(g.title)}</h2><p class="sub" style="margin:0 0 10px">${esc(c.name)}</p><dl class="meta"><dt>Size</dt><dd class="mono">${fmt(g.size)}</dd><dt>Play time</dt><dd class="mono">${fmtT(g.time)}</dd><dt>Last played</dt><dd class="mono">${g.played?new Date(g.played).toLocaleDateString():'Never'}</dd></dl></div></div>${g.desc?`<p class="desc">${esc(g.desc)}</p>`:''}
<button class="btn pri big" id="pl">${IC.played}${g.state?'Resume':'Play'}</button>
<div class="tools"><button class="btn" id="fv">${IC.fav}<span>${g.fav?'Unfavorite':'Favorite'}</span></button><button class="btn" id="ed">Edit</button><button class="btn" id="gal">Screenshots</button><button class="btn" id="fcv">Find cover</button>${g.state?'<button class="btn" id="rs">Reset save</button>':''}<button class="btn dng" id="rm">Remove</button></div><p class="file mono">${esc(g.file)}</p>`;
$('#cx').onclick=()=>d.close();
if(g.state)$('#rs').onclick=async()=>{await tx('states','readwrite',t=>t.objectStore('states').delete(id));g.state=false;await putG(g);toast('Save state cleared.');details(id)};
$('#fcv').onclick=async()=>{const b=$('#fcv');b.disabled=true;b.textContent='Searching…';try{await setCover(g,await findCover(g));await putG(g);render();details(id);toast('Cover updated.')}catch(e){b.disabled=false;b.textContent='Find cover';msg('Couldn’t find a cover',e.message)}};
$('#gal').onclick=()=>gallery(g);
$('#fv').onclick=async()=>{g.fav=!g.fav;await putG(g);render();details(id)};
$('#rm').onclick=()=>confirmD(`Remove “${g.title}” from the library? The stored copy is deleted from this browser; your original file is untouched.`,async()=>{await tx(['games','roms','states'],'readwrite',t=>{t.objectStore('games').delete(id);t.objectStore('roms').delete(id);t.objectStore('states').delete(id);t.objectStore('states').delete(SSK(id));t.objectStore('states').delete(IDBKeyRange.bound('qs:'+id+':','qs:'+id+':\uffff'))});games=games.filter(x=>x.id!==id);render();toast('Game removed.')});
$('#ed').onclick=()=>edit(g);$('#pl').onclick=()=>play(g);if(!d.open)d.showModal()}
function edit(g){const d=$('#dlg'),cur={cover:g.cover};
d.innerHTML=`<h2 style="margin-top:0">Edit game</h2><label for="et">Title</label><input id="et" value="${esc(g.title)}"><label for="ec">Console</label><select id="ec">${conOpts(g.con)}</select><label for="eds">Description</label><textarea id="eds" rows="3">${esc(g.desc)}</textarea>
<label>Cover image</label><div class="bar"><button class="btn" id="pc">Choose image…</button><button class="btn" id="rc">Remove cover</button></div><label for="eu">…or paste an image link</label><input id="eu" placeholder="https://…" inputmode="url">
<div class="acts"><button class="btn" id="cn2">Cancel</button><button class="btn pri" id="sv">Save</button></div>`;
$('#pc').onclick=()=>{$('#fc').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>3e6)return toast('Cover must be under 3 MB.');const r=new FileReader();r.onload=()=>{cur.cover=r.result;toast('Cover selected — press Save.')};r.readAsDataURL(f)};$('#fc').click()};
$('#rc').onclick=()=>{cur.cover='';toast('Cover will be removed on save.')};
$('#cn2').onclick=()=>details(g.id);
$('#sv').onclick=async()=>{const t=$('#et').value.trim();if(!t)return toast('Title can’t be empty.');const eu=$('#eu').value.trim();if(eu){if(!/^https?:\/\//i.test(eu))return toast('Image link must start with http:// or https://');cur.cover=await urlToCover(eu)}Object.assign(g,{title:t,con:$('#ec').value,desc:$('#eds').value.trim()});await setCover(g,cur.cover);await putG(g);render();details(g.id)}}

let pspOk=false;
async function play(g){const c=con(g.con),ext=(g.file.split('.').pop()||'').toLowerCase(),core=CORE_X[ext]||c.core;
if(g.con==='other'){const d=$('#dlg');d.innerHTML=`<h2 style="margin-top:0">Which console is this?</h2><p>“${esc(g.file)}” could belong to several systems, so I can’t tell. Pick one and I’ll remember it.</p><select id="pc2">${conOpts('ps1')}</select><div class="acts"><button class="btn" id="pcx">Cancel</button><button class="btn pri" id="pcg">Save and play</button></div>`;
$('#pcx').onclick=()=>d.close();$('#pcg').onclick=async()=>{g.con=$('#pc2').value;await putG(g);render();d.close();if(g.con!=='other')play(g)};if(!d.open)d.showModal();return}
if(!core)return msg(`${c.name} can’t run in the browser`,`The browser player (EmulatorJS) has no working core for this system. Open “${g.file}” in a standalone emulator${TIPS[g.con]?', for example '+TIPS[g.con]:''}. This entry still works for organizing and favorites.`);
if(core==='psp'&&!self.crossOriginIsolated&&!pspOk)return confirmD('PSP games need a special browser mode (cross-origin isolation, usually over HTTPS) that this page doesn’t have, so it will most likely stay black. Try anyway?',async()=>{pspOk=true;play(g)});
goFS();
const blob=await new Promise(r=>{try{const q=db.transaction('roms').objectStore('roms').get(g.id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
if(!blob)return msg('ROM file not found','The stored copy is missing, likely because the browser cleared its storage. Remove this entry and import the file again.');
g.played=Date.now();putG(g);$('#dlg').close();
let sUrl='';if(pref.auto!==false&&g.state){const sb=await getSt(g.id);if(sb)sUrl=URL.createObjectURL(sb)}
const url=URL.createObjectURL(blob),w=document.createElement('div');w.id='emu';
w.innerHTML=`<div class="hz" id="hz"><button class="xq" id="eq" aria-label="Quit game">✕</button><button class="xq" id="em" aria-label="Game menu">${IC.dots}</button><div class="pill"><div class="prow"><button class="pb" id="pshot" aria-label="Screenshot" title="Screenshot">${IC.cam}</button><button class="pb" id="psave" aria-label="Save to slot" title="Save">${IC.save}</button><button class="pb" id="pload" aria-label="Load from slot" title="Load">${IC.load}</button><button class="pb" id="pmute" aria-label="Mute" title="Mute">${IC.vol}</button><button class="pb" id="pfs" aria-label="Fullscreen" title="Fullscreen">${IC.fs}</button></div><div class="slots"><span id="slh">Save to slot</span><button data-sl="1">1</button><button data-sl="2">2</button><button data-sl="3">3</button></div></div></div><iframe title="Emulator" allow="fullscreen; gamepad; autoplay; cross-origin-isolated"></iframe>`;

document.body.appendChild(w);
const base=new URL((SG().ejs||'https://cdn.emulatorjs.org/stable/data/').replace(/\/?$/,'/'),location.href).href;
w.querySelector('iframe').srcdoc=`<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}#game{width:100%;height:100%}</style>${pref.ss!==false?'<script>(function(){var o=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,a){if(/webgl/.test(t))a=Object.assign({},a,{preserveDrawingBuffer:true});return o.call(this,t,a)}})()<\/script>':''}<body><div id="game"></div><script>EJS_player='#game';EJS_core=${JSON.stringify(core)};EJS_gameUrl=${JSON.stringify(url)};EJS_gameName=${JSON.stringify(g.title)};EJS_pathtodata=${JSON.stringify(base)};EJS_startOnLoaded=true;EJS_color='#34c98a';EJS_defaultOptions=${JSON.stringify(Object.assign(resOpts(core),pref.crt?{shader:'crt-easymode.glslp'}:{}))};${sUrl?'EJS_loadStateURL='+JSON.stringify(sUrl)+';':''}<\/script><script src="${base}loader.js" onerror="document.body.innerHTML='<p style=color:#fff;font-family:sans-serif;padding:20px>Couldn’t load the emulator files from ${base}. Check your connection or the emulator path in Settings.</p>'"><\/script></body>`;
EMU={g,w,t0:Date.now()};setupMenu(w);$('#eq').onclick=async()=>{$('#eq').disabled=true;let ok=false;if(pref.auto!==false)ok=await saveState();addTime();w.remove();outFS();EMU=null;URL.revokeObjectURL(url);if(sUrl)URL.revokeObjectURL(sUrl);render();if(ok)toast('Progress saved. It resumes next time.')};render()}
function msg(t,m){const d=$('#dlg');d.innerHTML=`<h2 style="margin-top:0">${esc(t)}</h2><p>${esc(m)}</p><div class="acts"><button class="btn pri" id="ok">OK</button></div>`;$('#ok').onclick=()=>d.close();if(!d.open)d.showModal()}

document.addEventListener('click',e=>{if(!e.target.closest('#side,#tg'))$('#side').classList.remove('open');const pb=e.target.closest('[data-play]');if(pb){const g=games.find(x=>x.id===pb.dataset.play);if(g)play(g);return}const v=e.target.closest('[data-v]');if(v){view=v.dataset.v;$('#q').value='';$('#side').classList.remove('open');render();$('#content').scrollTop=0;return}
const c=e.target.closest('.card');if(c)details(c.dataset.id)});
$('#tg').onclick=()=>{const s=$('#side');innerWidth<761?s.classList.toggle('open'):s.classList.toggle('min')};
$('#q').oninput=()=>{if((view==='home'||view==='set')&&$('#q').value.trim())view='all';render()};
$('#imp').onclick=()=>{const d=$('#dlg');d.innerHTML=`<h2 style="margin-top:0">Import games</h2><p>Only import games you legally own. Files stay in this browser.</p><div class="acts" style="justify-content:flex-start"><button class="btn pri" id="a1">Choose files</button><button class="btn" id="a2">Choose folder</button><button class="btn" id="a3">Cancel</button></div>`;$('#a1').onclick=()=>{d.close();$('#fi').click()};$('#a2').onclick=()=>{d.close();$('#fd').click()};$('#a3').onclick=()=>d.close();d.showModal()};
$('#fi').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#fd').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#rnd').onclick=()=>{const l=view==='home'?games:filtered();if(!l.length)return toast('Import some games first.');details(l[Math.random()*l.length|0].id)};
const cont=$('#content');['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();cont.classList.add('drop')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'||e.target===document.documentElement||!e.relatedTarget)cont.classList.remove('drop')}));
document.addEventListener('drop',e=>{if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').then(r=>{r.onupdatefound=()=>{const n=r.installing;n&&n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)toast('Update ready. Reload to use the new version.')})}}).catch(()=>{});
let ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(view==='set')render()});addEventListener('appinstalled',()=>{ip=null;if(view==='set')render()});
(async()=>{theme();try{db=await openDB();games=await tx('games','readonly',t=>t.objectStore('games').getAll());tx('states','readwrite',t=>t.objectStore('states').delete(IDBKeyRange.bound('shot:','shot:\uffff'))).catch(()=>{})}catch(e){toast('Browser storage is unavailable, so the library can’t be saved in this window.');db=null}
if(!db){db={transaction(){throw new Error('no db')}}}
render();backfill()})();
</script>
</body>
</html>
